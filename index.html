<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172c4a">
<title>WordWise — PDF Vocabulary Learning</title>
<style>
:root{--navy:#172c4a;--green:#218765;--mint:#e3f4ed;--bg:#f3f6fa;--ink:#1d3048;--muted:#66758a;--line:#e2e8f0;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--green);color:#fff;font-weight:650}button.secondary{background:#eef2f6;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--green);font-weight:600;font-size:13px}
header{background:var(--navy);color:#fff;padding:22px max(18px,calc((100% - 1120px)/2));}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}.logo{width:39px;height:39px;border-radius:12px;background:#d9f3e8;color:var(--navy);display:grid;place-items:center;font-size:21px}
header h1{font-size:clamp(25px,4vw,38px);line-height:1.12;margin:28px 0 8px;max-width:650px}header p{color:#cad6e4;margin:0;max-width:650px}
.status{border:1px solid #51708e;color:#d9f3e8;border-radius:99px;padding:6px 10px;font-size:12px;white-space:nowrap}
main{max-width:1120px;margin:25px auto;padding:0 18px 50px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.tabs button{background:#fff;color:var(--muted);border:1px solid var(--line);white-space:nowrap}.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat,.panel,.word-card,.section-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 4px 16px #18324a08}.stat strong{display:block;font-size:29px;color:var(--navy)}.stat span,.muted{color:var(--muted);font-size:13px}
.panel{margin-top:16px}.panel h2{font-size:19px;margin:0 0 12px}.upload{border:1.5px dashed #a9b8c8;background:#f9fbfd;border-radius:14px;padding:22px;text-align:center}.upload input{max-width:100%;margin:12px auto}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.progress{height:8px;border-radius:9px;background:#e9eef3;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);width:0}
.sections{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.section-card{cursor:pointer}.section-card.selected{border:2px solid var(--green);padding:17px}.section-card strong{display:block}.word-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.word-card h3{margin:0 0 4px}.word-card p{margin:5px 0;color:var(--muted);font-size:13px}
.word-card .wc{display:flex;gap:12px;align-items:flex-start}.word-card .wc>div{flex:1;min-width:0}
.pic{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#eef2f6;flex:none}
.pic.big{width:min(230px,70%);height:auto;max-height:190px;aspect-ratio:4/3;margin:0 auto}
.nopic{width:90px;height:90px;border-radius:12px;background:#eef2f6;display:grid;place-items:center;font-size:28px;flex:none}
.nopic.big{width:120px;height:90px;margin:0 auto}
.flash{max-width:620px;margin:10px auto;text-align:center;padding:30px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center}.flash .big{font-size:clamp(30px,6vw,43px);font-weight:800;color:var(--navy);margin:12px 0}.flash .meaning{font-size:17px;max-width:480px}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.option{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:9px 0}.option.correct{border-color:var(--green);background:var(--mint)}.option.wrong{border-color:#b54747;background:#fbeaea}
.settings input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
.hidden{display:none!important}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.sections{grid-template-columns:repeat(2,1fr)}.word-list{grid-template-columns:1fr}header{padding:18px}main{margin-top:17px}.stat:last-child{grid-column:span 2}}
</style>
</head>
<body>
<header>
 <div class="top"><div class="brand"><div class="logo">▣</div> WordWise</div><span class="status">● Meanings + pictures</span></div>
 <h1>Learn words. Build confidence.</h1>
